<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - Every Drop Counts</title>
  <link rel="stylesheet" href="style.css">
  <style>
    section { background: var(--light); }
    form { max-width: 420px; margin: auto; padding: 30px; background: white; border-radius: 20px; text-align: left; box-shadow: 0 8px 25px rgba(10, 79, 122, 0.2); }
    label { font-weight: bold; }
    small { display: block; color: gray; }
    input[type=text], input[type=number], select { width: 100%; padding: 10px; margin: 5px 0 18px; border: 2px solid var(--mid); border-radius: 10px; font-size: 1rem; }
    .choice { margin: 5px 0 18px; }
    form .btn { margin-top: 10px; cursor: pointer; }
    #result * { animation: rise 0.6s ease; }
    #result { max-width: 420px; margin: 25px auto; padding: 20px; border-radius: 20px; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="problem.html">Problem</a>
    <a href="calculator.html" class="current">Calculator</a>
    <a href="solutions.html">Solutions</a>
    <a href="sources.html">Sources</a>
  </nav>

  <header style="background: linear-gradient(rgba(10, 79, 122, 0.75), rgba(10, 79, 122, 0.55)), url(images/tap.jpg) center / cover;">
    <h1>Water Use Calculator 🧮</h1>
    <p>How many litres do you use in a day?</p>
  </header>

  <section>
    <form onsubmit="calculate(event)">
      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="e.g. Aarav" required>

      <label for="shower">Shower time</label>
      <small>Minutes per day</small>
      <input type="number" id="shower" value="10" min="0" max="60" required>

      <label for="flush">Toilet flushes</label>
      <small>Per day</small>
      <input type="number" id="flush" value="5" min="0" max="30" required>

      <label for="laundry">Washing machine</label>
      <small>Loads per week (just your clothes)</small>
      <input type="number" id="laundry" value="3" min="0" max="20" required>

      <label>Do you leave the tap running while brushing?</label>
      <div class="choice">
        <input type="radio" name="tap" value="yes" checked> Yes
        <input type="radio" name="tap" value="no"> No
      </div>

      <label for="dishes">How do you wash dishes?</label>
      <select id="dishes">
        <option value="tap">Under a running tap</option>
        <option value="bowl">In a bowl or basin</option>
      </select>

      <button class="btn">Calculate 💧</button>
      <button type="reset" class="btn">Reset</button>
    </form>

    <div id="result"></div>
  </section>

  <footer>Class XI - Web Applications (803) - Priyam Agarwal &amp; Dhairya Khetan</footer>

  <script src="calculator.js"></script>
</body>
</html>
