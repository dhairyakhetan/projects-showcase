<style>
  :root { --bg: #0b0c0a; --fg: #e8e6dc; --dim: #9fa294; --line: #2c3027; --accent: #c8f55a; --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #06120a; color: var(--fg); font-family: var(--mono); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; background: #06120a; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { position: relative; z-index: 5; flex: none; display: flex; align-items: stretch; height: 50px; background-color: var(--bg); background-image: radial-gradient(circle at 10px 10px, #1b1e16 1px, transparent 1.3px); background-size: 20px 20px; border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(200, 245, 90, 0.2), 0 8px 18px rgba(0, 0, 0, 0.35); font-size: 12px; }
  header a, header button { color: var(--fg); text-decoration: none; font: inherit; }
  .logo { display: flex; align-items: center; padding: 0 20px; border-right: 1px solid var(--line); font-size: 16px; letter-spacing: .02em; background: var(--bg); }
  .logo b { color: var(--accent); font-weight: 600; }
  .back { display: flex; align-items: center; gap: 10px; padding: 0 20px; border-right: 1px solid var(--line); transition: background .15s, color .15s; }
  .back .arrow { display: inline-block; transition: transform .18s; }
  .back:hover, .back:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  .back:hover .arrow, .back:focus-visible .arrow { transform: translateX(-4px); }
  /* the active-tab look from the portfolio's own header */
  .tab { display: flex; align-items: center; gap: 10px; padding: 0 22px; border-right: 1px solid var(--line); border-top: 2px solid var(--accent); background: #121410; color: var(--fg); }
  .tab em { font-style: normal; font-size: 10px; color: var(--accent); }
  .tab span { color: #6f7268; }
  .spacer { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; transition: background .15s, color .15s; }
  .ctl b { font-weight: 400; color: var(--fg); }
  .ctl svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .ctl:hover, .ctl:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  .ctl:hover b, .ctl:focus-visible b { color: var(--bg); }
  #stage { position: relative; flex: 1; min-height: 0; background: #06120a; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; background: #06120a; transition: opacity .35s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0; font: 400 clamp(28px, 6vw, 44px)/1 Georgia, "Times New Roman", serif; color: #f2d07a; letter-spacing: .02em; }
  #track { width: min(320px, 70vw); height: 3px; background: #1a2a20; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #status { margin: 0; font-size: 12px; color: var(--dim); min-height: 1.4em; }
  #skip { margin-top: 6px; font: 12px var(--mono); color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 9px 16px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .35s, background .15s, color .15s, border-color .15s; }
  #skip.show { opacity: 1; pointer-events: auto; }
  #skip:hover, #skip:focus-visible { background: var(--accent); color: var(--bg); border-color: var(--accent); outline: none; }
  #loading.failed #bar { background: #e5604d; }
  #rotate { display: none; flex: none; padding: 8px 16px; font-size: 11px; color: var(--dim); text-align: center; border-top: 1px solid #23251f; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }
  #app:fullscreen header, #app:fullscreen #rotate { display: none; }
  /* short screens (a phone on its side): the same bar, slimmer, so the table keeps its room */
  @media (max-height: 520px) { header { height: 36px; } .logo, .back, .ctl { padding: 0 14px; } .tab { display: none; } }
  @media (max-width: 760px) { .tab, .ctl b { display: none; } .back .lbl { display: none; } .ctl { padding: 0 16px; } }
  @media (display-mode: standalone) and (orientation: portrait), (display-mode: fullscreen) and (orientation: portrait) { #rotate { display: block; } }
</style>

<body>
<div id="app">
  <header>
    <span class="logo"><b>dk</b>_</span>
    <a class="back" href="/home" aria-label="Back to the portfolio"><span class="arrow">&larr;</span><span class="lbl">back to the site</span></a>
    <span class="tab"><em>06</em>Blackjack<span>.js</span></span>
    <span class="spacer"></span>
    <button class="ctl" id="snd" type="button" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndwave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><b id="sndl">sound on</b></button>
    <button class="ctl" id="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><b>fullscreen</b></button>
  </header>
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="Blackjack table"></canvas>
    <div id="loading" role="status">
      <h1>Blackjack</h1>
      <div id="track"><div id="bar"></div></div>
      <p id="status">Loading ...</p>
      <button id="skip" type="button">Skip loading?</button>
      <noscript><p>This game needs JavaScript.</p></noscript>
    </div>
  </div>
  <div id="rotate">Better with your phone turned sideways.</div>
</div>
<script type="module" src="/blackjack/js/main.js"></script>
</body>
</html>
