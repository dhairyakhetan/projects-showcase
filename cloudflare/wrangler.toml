name = "logger"
main = "worker.js"
compatibility_date = "2024-09-23"

# Daily sync at 03:00 UTC. Without this the `scheduled` handler never fires and
# data only refreshes when a visitor arrives after the 24h window has lapsed.
[triggers]
crons = ["0 3 * * *"]

# TODO: replace with the real namespace id (`wrangler kv namespace list`).
[[kv_namespaces]]
binding = "STATS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# GITHUB_TOKEN is a secret, not a var — set it with:
#   wrangler secret put GITHUB_TOKEN
